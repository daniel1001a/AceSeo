[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aceseo"
version = "0.1.0.dev0"
description = "Local-first, rule-first SEO checks and AI-search citation evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.urls]
Homepage = "https://github.com/daniel1001a/AceSeo"

[tool.setuptools.packages.find]
include = ["geo*"]
